name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0 点（北京时间早上 8 点）自动执行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_repository: sincalaway/prompt-store
          upstream_branch: main          # 上游默认分支是 main
          target_branch: main            # 你的 fork 默认分支也写成 main
          git_pull_args: --ff-only       # 有冲突就失败，避免强制覆盖
